name: 🔐 Pipeline DevSecOps

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GERENCIAMENTO DE SECRETS COM GITHUB ACTIONS
      # Remove as credenciais expostas do codigo-fonte.
      # Recupera os valores configurados nos GitHub Secrets.
      # Utiliza o sed para substituir os marcadores no JavaScript.
      # Para o desafio, usamos valores ficticios, pois o site sera publico.
      - name: 🔐 Inserir Secrets no JavaScript
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Verifica se os secrets foram configurados
          test -n "$API_KEY" || { echo "API_KEY nao configurada"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD nao configurada"; exit 1; }

          # Substitui os marcadores pelos valores de demonstracao
          sed -i "s|__API_KEY__|$API_KEY|g" src/script.js
          sed -i "s|__DB_PASSWORD__|$DB_PASSWORD|g" src/script.js

          echo "Valores de demonstracao inseridos com sucesso"

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"

      # SECRETS SCANNING COM GITLEAKS
      # Utiliza a action oficial para detectar credenciais expostas.
      # Se encontrar segredos, bloqueia a pipeline.
      - name: 🔑 Secrets Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # VERIFICACAO DO HISTORICO COM GITLEAKS
      # Complementa a action, analisando os commits anteriores.
      # O --exit-code 1 faz a pipeline falhar se encontrar segredos.
      - name: 🔎 Gitleaks - Historico Completo
        run: |
          # Instala o Gitleaks
          VERSION=8.24.3
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

          # Analisa o historico completo do repositorio
          /tmp/gitleaks git . --redact --exit-code 1

      # SAST COM SEMGREP
      # Analisa o codigo-fonte em busca de vulnerabilidades.
      # Verifica padroes inseguros, como XSS e funcoes perigosas.
      # O --error faz a pipeline falhar quando houver findings.
      - name: 🔍 SAST - Semgrep
        run: |
          # Instala o Semgrep
          pip install semgrep

          # Analisa o codigo da pasta src
          semgrep scan --config auto --config p/xss --error src/

      # SCA COM GRYPE
      # Analisa as dependencias do projeto em busca de
      # vulnerabilidades conhecidas (CVEs).
      # Se encontrar vulnerabilidades MEDIUM, HIGH ou CRITICAL,
      # o Grype retorna erro e bloqueia a pipeline.
      - name: 📦 SCA - Grype
        run: |
          # Gera o arquivo que registra as dependencias do projeto
          npm install --package-lock-only --no-audit --no-fund

          # Instala a ferramenta Grype
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

          # Analisa as dependencias e bloqueia vulnerabilidades medias ou maiores
          grype dir:. --fail-on medium

      # ── Empacota o site em um artefato tar (formato que o Pages consome)
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C src \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest" > artifact.tar.sha256
          echo "SHA256: $digest"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ASSINATURA REAL COM COSIGN
      # Assina o artefato usando a identidade do GitHub Actions (OIDC).
      # Gera um bundle com as informacoes necessarias para verificacao.
      - name: ✍️ Assinar artefato
        run: |
          cosign sign-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --yes

          echo "Artefato assinado com sucesso."

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@v4.1.3
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

            # VERIFICACAO DA ASSINATURA COM COSIGN
      # Confirma que o artefato foi assinado pelo workflow do repositorio.
      # Se a verificacao falhar, a pipeline nao realiza o deploy.
      - name: 🔎 Verificar assinatura do artefato
        run: |
          cosign verify-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          echo "Assinatura valida — artefato integro e autentico."
          
      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4